# 배포 예시. 서버의 실제 파일은 스택 루트(~/stack/docker-compose.yml)에 있고,
# 이 저장소에는 참고용 사본만 둔다. 이 앱 하나만 띄우려면 이 파일로 충분하다.
#
#   cp .env.example .env   # 값 채우기
#   docker compose -f deploy/docker-compose.example.yml up -d --build

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.example:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # 1 GB 서버 기준으로 기본값을 낮췄다. 메모리가 넉넉하면 지워도 된다.
    command: >
      postgres
      -c shared_buffers=64MB
      -c max_connections=20
      -c work_mem=2MB
      -c maintenance_work_mem=32MB
      -c effective_cache_size=256MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      db:
        condition: service_healthy
    # 포트를 열지 않는다. 모든 트래픽은 Caddy를 지난다.

volumes:
  caddy_data:
  caddy_config:
  pgdata:
