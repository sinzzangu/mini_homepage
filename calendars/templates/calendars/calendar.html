<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>캘린더 · dodamthepig</title>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/locales-all.global.min.js"></script>
<style>
  :root {
    --bg: #1a1a2e;
    --panel: #16213e;
    --ink: #eee;
    --muted: #9ca3af;
    --accent: #7c5cff;

    --fc-page-bg-color: var(--bg);
    --fc-border-color: #2c3358;
    --fc-neutral-bg-color: var(--panel);
    --fc-today-bg-color: rgba(124, 92, 255, .12);
    --fc-event-bg-color: var(--accent);
    --fc-event-border-color: var(--accent);
    --fc-event-text-color: #fff;
    --fc-button-bg-color: var(--panel);
    --fc-button-border-color: #2c3358;
    --fc-button-hover-bg-color: #1e2a4d;
    --fc-button-hover-border-color: #3b4470;
    --fc-button-active-bg-color: var(--accent);
    --fc-button-active-border-color: var(--accent);
  }
  /* 가로 스크롤 방지 — 폭을 넘기는 요소가 생겨도 화면이 좌우로 밀리지 않게 한다.
     overflow-x는 html에만 준다: body에 주면 body가 스크롤 컨테이너가 되어
     FullCalendar의 sticky 날짜 헤더(height:'auto'일 때 켜진다)가 안 붙는다.
     text-size-adjust는 아이폰 가로모드에서 글자가 임의로 커지는 것을 막는다. */
  html { overflow-x: hidden; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body { max-width: 100%; }
  body {
    font-family: system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    margin: 0;
    padding: 1rem clamp(.5rem, 3vw, 2rem) 2rem;
  }
  header { display: flex; align-items: baseline; gap: .75rem; margin-bottom: 1rem;
           max-width: 1100px; margin-inline: auto; flex-wrap: wrap; }
  h1 { font-size: 1.35rem; margin: 0; }
  header p { color: var(--muted); margin: 0; font-size: .85rem; }
  /* 안내 문구는 입력 방식에 따라 하나만 보여준다 (기본은 마우스용) */
  .hint-touch { display: none; }
  @media (pointer: coarse) {
    .hint-pointer { display: none; }
    .hint-touch { display: block; }
  }
  .who { margin-left: auto; display: flex; align-items: center; gap: .6rem;
         font-size: .85rem; color: var(--muted); }
  .who strong { color: var(--ink); font-weight: 600; }
  /* 설정 링크는 로그아웃 버튼과 같은 규칙을 공유한다 — 헤더에서 둘의 시각적 무게를 맞춘다 */
  .who button, .who .btn { background: none; border: 1px solid #2c3358; color: var(--muted);
                padding: .3rem .7rem; border-radius: 6px; cursor: pointer; font-size: .8rem; }
  /* a 태그라 밑줄·줄바꿈·수직정렬만 버튼처럼 맞춰 준다 (line-height는 버튼과 같은 normal) */
  .who .btn { display: inline-flex; align-items: center; justify-content: center;
              text-decoration: none; white-space: nowrap; }
  .who button:hover, .who .btn:hover { border-color: #3b4470; color: var(--ink); }
  #calendar { max-width: 1100px; margin: 0 auto; }
  .fc .fc-toolbar-title { font-size: 1.1rem; }
  .fc .fc-col-header-cell-cushion,
  .fc .fc-daygrid-day-number { color: var(--ink); text-decoration: none; }
  .fc-theme-standard .fc-scrollgrid,
  .fc-theme-standard td, .fc-theme-standard th { border-color: var(--fc-border-color); }
  .fc .fc-day-sat .fc-daygrid-day-number { color: #93c5fd; }
  .fc .fc-day-sun .fc-daygrid-day-number { color: #fca5a5; }
  #error {
    display: none; max-width: 1100px; margin: 0 auto .75rem;
    background: #7f1d1d; color: #fee2e2; padding: .6rem .8rem; border-radius: 6px;
    font-size: .85rem;
  }
  /* '+n개 더' 팝오버가 화면 밖으로 나가지 않게 */
  .fc .fc-popover { max-width: calc(100vw - 1rem); }
  .fc .fc-popover-body { max-height: 60vh; overflow-y: auto; }

  /* ===== 좁은 화면(폰) 대응 =====
     레이아웃과 터치 크기만 손댄다. API 호출·이벤트 처리 로직은 그대로다.
     FullCalendar가 주입하는 스타일시트는 head의 첫 script 앞에 들어가므로
     같은 특이도(.fc .foo)면 아래 규칙이 나중에 와서 이긴다. */
  @media (max-width: 560px) {
    body { padding: .75rem .5rem 1.5rem; }
    header { gap: .4rem .6rem; margin-bottom: .6rem; }
    h1 { font-size: 1.1rem; }
    /* 안내 문구는 제목/사용자 줄 아래로 내려 한 줄을 다 쓴다 */
    header p { order: 3; flex: 1 0 100%; font-size: .75rem; line-height: 1.4; }
    .who { font-size: .78rem; flex-wrap: wrap; justify-content: flex-end; gap: .5rem; }
    .who button, .who .btn { min-height: 40px; padding: .45rem .8rem; font-size: .78rem; }
    #error { font-size: .8rem; }

    /* 툴바: 제목을 윗줄로 올리고 버튼은 아랫줄에 좌우로 배치한다.
       버튼이 한 줄에 다 들어가지 않아도 넘치지 않고 줄바꿈된다. */
    .fc .fc-header-toolbar.fc-toolbar { flex-wrap: wrap; gap: .5rem; margin-bottom: .75rem; }
    .fc .fc-header-toolbar .fc-toolbar-chunk { display: flex; align-items: center;
                                               flex: 0 0 auto; min-width: 0; }
    .fc .fc-header-toolbar .fc-toolbar-chunk:nth-child(2) {
      order: -1; flex: 1 0 100%; justify-content: center; }
    .fc .fc-toolbar-title { font-size: 1rem; }
    .fc .fc-toolbar > * > :not(:first-child) { margin-left: .4em; }
    /* 터치 대상 최소 44px */
    .fc .fc-button { min-height: 44px; min-width: 44px; padding: .35rem .55rem;
                     font-size: .85rem; line-height: 1.2; }

    .fc { font-size: .85rem; }
    .fc .fc-col-header-cell-cushion { padding: .35rem .1rem; font-size: .78rem; }
    .fc .fc-daygrid-day-number { padding: .2rem .3rem; font-size: .78rem; }
    /* 100%는 FullCalendar가 행 높이를 맞추는 데 쓰므로 유지하고 하한만 올린다 */
    .fc .fc-daygrid-day-frame { min-height: max(100%, 3.4em); }
    .fc .fc-daygrid-event { padding: 1px 3px; margin-top: 2px; font-size: .8rem;
                            min-height: 20px; line-height: 1.6; }
    .fc .fc-daygrid-more-link { min-height: 20px; padding: 0 3px; font-size: .8rem; }
    .fc .fc-timegrid-slot { height: 2.4em; }
    .fc .fc-timegrid-slot-label-cushion,
    .fc .fc-timegrid-axis-cushion { font-size: .7rem; padding: 0 .25rem; }
  }
</style>
</head>
<body>
<header>
  <h1>🐷 캘린더</h1>
  <p class="hint-pointer">빈 칸을 클릭하거나 드래그해서 일정 추가 · 일정을 클릭하면 수정/삭제</p>
  <p class="hint-touch">빈 칸을 길게 눌러 일정 추가 · 일정을 탭하면 수정/삭제</p>
  <div class="who">
    <span><strong>{{ user.username }}</strong>님의 캘린더</span>
    {# 경로를 박지 않고 URL 이름을 쓴다 — 메인(/cal/settings/)과 서브도메인(/settings/) 양쪽에서 맞아야 한다 #}
    <a class="btn" href="{% url 'settings' %}">설정</a>
    <form method="post" action="{% url 'logout' %}">
      {% csrf_token %}
      <button type="submit">로그아웃</button>
    </form>
  </div>
</header>
<div id="error"></div>
<div id="calendar"></div>

<script>
  // 상대경로를 쓰는 이유: 같은 JS가 cal 서브도메인의 / 와 메인 도메인의
  // /cal/ 양쪽에서 돌아야 한다.
  function cookie(name) {
    const hit = document.cookie.split('; ').find((row) => row.startsWith(name + '='));
    return hit ? decodeURIComponent(hit.slice(name.length + 1)) : '';
  }
  // CSRF 토큰이 1차 방어, X-Requested-With가 2차 방어선.
  const XHR_HEADERS = {
    'X-Requested-With': 'XMLHttpRequest',
    'X-CSRFToken': cookie('csrftoken'),
  };
  const errorBox = document.getElementById('error');

  function showError(message) {
    errorBox.textContent = message;
    errorBox.style.display = 'block';
    setTimeout(() => { errorBox.style.display = 'none'; }, 6000);
  }

  async function api(path, options = {}) {
    const response = await fetch(path, {
      ...options,
      headers: { ...XHR_HEADERS, ...(options.headers || {}) },
    });
    if (!response.ok) {
      let detail = response.statusText;
      try {
        const body = await response.json();
        if (body && body.error) detail = body.error;
      } catch (e) { /* 본문이 JSON이 아니면 statusText 사용 */ }
      throw new Error(`${response.status} ${detail}`);
    }
    return response.status === 204 ? null : response.json();
  }

  function writeJSON(path, method, payload) {
    return api(path, {
      method,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
  }

  // 화면 폭·입력 방식에 따라 뷰 옵션만 바꾼다. 툴바가 넘치는 문제는 CSS가 처리하므로
  // 여기서 headerToolbar 구성을 줄이지는 않는다(데스크톱과 버튼 구성이 같다).
  // 폭 판단은 처음 한 번만 한다 — 화면을 돌릴 때 보고 있던 뷰가 바뀌면 오히려 혼란스럽다.
  const isNarrow = window.matchMedia('(max-width: 480px)').matches;

  const calendarEl = document.getElementById('calendar');
  const calendar = new FullCalendar.Calendar(calendarEl, {
    locale: 'ko',
    timeZone: 'Asia/Seoul',
    // 폰에서는 7칸 월 뷰가 너무 좁다 → 하루 뷰로 시작하고 월/주 버튼으로 넘어간다
    initialView: isNarrow ? 'timeGridDay' : 'dayGridMonth',
    height: 'auto',
    nowIndicator: true,
    selectable: true,
    selectMirror: true,
    editable: true,
    eventResizableFromStart: true,
    dayMaxEvents: isNarrow ? 2 : 3,
    // 폰의 하루 뷰는 30분 칸이면 24시간이 너무 길어진다. 1시간 칸으로 줄인다
    slotDuration: isNarrow ? '01:00:00' : '00:30:00',
    // 짧은 일정도 손가락으로 누를 수 있게 최소 높이를 키운다(기본 15px)
    eventMinHeight: isNarrow ? 26 : 15,
    // 길게 누르기 지연은 터치일 때만 쓰인다(마우스는 영향 없음).
    // 기본 1초는 답답하고, 너무 짧으면 스크롤과 헷갈리므로 0.6초로 둔다
    selectLongPressDelay: 600,
    eventLongPressDelay: 600,
    headerToolbar: {
      left: 'prev,next today',
      center: 'title',
      right: 'dayGridMonth,timeGridWeek,timeGridDay',
    },
    buttonText: { today: '오늘', month: '월', week: '주', day: '일' },

    events(info, success, failure) {
      const query = `api/events?start=${encodeURIComponent(info.startStr)}&end=${encodeURIComponent(info.endStr)}`;
      api(query).then(success).catch((err) => {
        showError(`일정을 불러오지 못했습니다: ${err.message}`);
        failure(err);
      });
    },

    // 빈 칸 드래그 → 기간이 정해진 일정 생성.
    async select(info) {
      const title = prompt('새 일정 제목:');
      calendar.unselect();
      if (title === null) return;
      if (!title.trim()) { showError('제목이 비어 있어 만들지 않았습니다.'); return; }
      try {
        await writeJSON('api/events', 'POST', {
          title: title.trim(),
          start: info.startStr,
          end: info.endStr,
          allDay: info.allDay,
        });
        calendar.refetchEvents();
      } catch (err) {
        showError(`생성 실패: ${err.message}`);
      }
    },

    // 일정 클릭 → 제목 수정, 빈 값이면 삭제 확인.
    async eventClick(info) {
      const event = info.event;
      const sourceName = event.extendedProps.sourceName;
      if (sourceName) {
        // 가져온 일정은 미러다. 원본에서 고쳐야 한다.
        showError(`'${sourceName}'에서 가져온 일정입니다. 원본 캘린더에서 수정하세요.`);
        return;
      }
      const next = prompt('제목 수정 (비우고 확인하면 삭제):', event.title);
      if (next === null) return;
      try {
        if (!next.trim()) {
          if (!confirm(`"${event.title}" 일정을 삭제할까요?`)) return;
          await api(`api/events/${event.id}`, { method: 'DELETE' });
        } else {
          await writeJSON(`api/events/${event.id}`, 'PATCH', { title: next.trim() });
        }
        calendar.refetchEvents();
      } catch (err) {
        showError(`수정 실패: ${err.message}`);
      }
    },

    eventDrop: (info) => persistTimes(info),
    eventResize: (info) => persistTimes(info),
  });

  // 드래그/리사이즈 결과를 서버에 반영. 실패하면 화면을 원상복구.
  async function persistTimes(info) {
    const event = info.event;
    try {
      await writeJSON(`api/events/${event.id}`, 'PATCH', {
        start: event.startStr,
        end: event.endStr || null,
        allDay: event.allDay,
      });
    } catch (err) {
      showError(`시간 변경 실패: ${err.message}`);
      info.revert();
    }
  }

  calendar.render();
</script>
</body>
</html>
