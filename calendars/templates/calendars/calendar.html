<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>캘린더 · dodamthepig</title>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/locales-all.global.min.js"></script>
<style>
  :root {
    --bg: #1a1a2e;
    --panel: #16213e;
    --ink: #eee;
    --muted: #9ca3af;
    --accent: #7c5cff;

    --fc-page-bg-color: var(--bg);
    --fc-border-color: #2c3358;
    --fc-neutral-bg-color: var(--panel);
    --fc-today-bg-color: rgba(124, 92, 255, .12);
    --fc-event-bg-color: var(--accent);
    --fc-event-border-color: var(--accent);
    --fc-event-text-color: #fff;
    --fc-button-bg-color: var(--panel);
    --fc-button-border-color: #2c3358;
    --fc-button-hover-bg-color: #1e2a4d;
    --fc-button-hover-border-color: #3b4470;
    --fc-button-active-bg-color: var(--accent);
    --fc-button-active-border-color: var(--accent);
  }
  body {
    font-family: system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    margin: 0;
    padding: 1rem clamp(.5rem, 3vw, 2rem) 2rem;
  }
  header { display: flex; align-items: baseline; gap: .75rem; margin-bottom: 1rem;
           max-width: 1100px; margin-inline: auto; flex-wrap: wrap; }
  h1 { font-size: 1.35rem; margin: 0; }
  header p { color: var(--muted); margin: 0; font-size: .85rem; }
  .who { margin-left: auto; display: flex; align-items: center; gap: .6rem;
         font-size: .85rem; color: var(--muted); }
  .who strong { color: var(--ink); font-weight: 600; }
  .who button { background: none; border: 1px solid #2c3358; color: var(--muted);
                padding: .3rem .7rem; border-radius: 6px; cursor: pointer; font-size: .8rem; }
  .who button:hover { border-color: #3b4470; color: var(--ink); }
  #calendar { max-width: 1100px; margin: 0 auto; }
  .fc .fc-toolbar-title { font-size: 1.1rem; }
  .fc .fc-col-header-cell-cushion,
  .fc .fc-daygrid-day-number { color: var(--ink); text-decoration: none; }
  .fc-theme-standard .fc-scrollgrid,
  .fc-theme-standard td, .fc-theme-standard th { border-color: var(--fc-border-color); }
  .fc .fc-day-sat .fc-daygrid-day-number { color: #93c5fd; }
  .fc .fc-day-sun .fc-daygrid-day-number { color: #fca5a5; }
  #error {
    display: none; max-width: 1100px; margin: 0 auto .75rem;
    background: #7f1d1d; color: #fee2e2; padding: .6rem .8rem; border-radius: 6px;
    font-size: .85rem;
  }
</style>
</head>
<body>
<header>
  <h1>🐷 캘린더</h1>
  <p>빈 칸을 클릭하거나 드래그해서 일정 추가 · 일정을 클릭하면 수정/삭제</p>
  <div class="who">
    <span><strong>{{ user.username }}</strong>님의 캘린더</span>
    <form method="post" action="{% url 'logout' %}">
      {% csrf_token %}
      <button type="submit">로그아웃</button>
    </form>
  </div>
</header>
<div id="error"></div>
<div id="calendar"></div>

<script>
  // 상대경로를 쓰는 이유: 같은 JS가 cal 서브도메인의 / 와 메인 도메인의
  // /cal/ 양쪽에서 돌아야 한다.
  function cookie(name) {
    const hit = document.cookie.split('; ').find((row) => row.startsWith(name + '='));
    return hit ? decodeURIComponent(hit.slice(name.length + 1)) : '';
  }
  // CSRF 토큰이 1차 방어, X-Requested-With가 2차 방어선.
  const XHR_HEADERS = {
    'X-Requested-With': 'XMLHttpRequest',
    'X-CSRFToken': cookie('csrftoken'),
  };
  const errorBox = document.getElementById('error');

  function showError(message) {
    errorBox.textContent = message;
    errorBox.style.display = 'block';
    setTimeout(() => { errorBox.style.display = 'none'; }, 6000);
  }

  async function api(path, options = {}) {
    const response = await fetch(path, {
      ...options,
      headers: { ...XHR_HEADERS, ...(options.headers || {}) },
    });
    if (!response.ok) {
      let detail = response.statusText;
      try {
        const body = await response.json();
        if (body && body.error) detail = body.error;
      } catch (e) { /* 본문이 JSON이 아니면 statusText 사용 */ }
      throw new Error(`${response.status} ${detail}`);
    }
    return response.status === 204 ? null : response.json();
  }

  function writeJSON(path, method, payload) {
    return api(path, {
      method,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
  }

  const calendarEl = document.getElementById('calendar');
  const calendar = new FullCalendar.Calendar(calendarEl, {
    locale: 'ko',
    timeZone: 'Asia/Seoul',
    initialView: 'dayGridMonth',
    height: 'auto',
    nowIndicator: true,
    selectable: true,
    selectMirror: true,
    editable: true,
    eventResizableFromStart: true,
    dayMaxEvents: 3,
    headerToolbar: {
      left: 'prev,next today',
      center: 'title',
      right: 'dayGridMonth,timeGridWeek,timeGridDay',
    },
    buttonText: { today: '오늘', month: '월', week: '주', day: '일' },

    events(info, success, failure) {
      const query = `api/events?start=${encodeURIComponent(info.startStr)}&end=${encodeURIComponent(info.endStr)}`;
      api(query).then(success).catch((err) => {
        showError(`일정을 불러오지 못했습니다: ${err.message}`);
        failure(err);
      });
    },

    // 빈 칸 드래그 → 기간이 정해진 일정 생성.
    async select(info) {
      const title = prompt('새 일정 제목:');
      calendar.unselect();
      if (title === null) return;
      if (!title.trim()) { showError('제목이 비어 있어 만들지 않았습니다.'); return; }
      try {
        await writeJSON('api/events', 'POST', {
          title: title.trim(),
          start: info.startStr,
          end: info.endStr,
          allDay: info.allDay,
        });
        calendar.refetchEvents();
      } catch (err) {
        showError(`생성 실패: ${err.message}`);
      }
    },

    // 일정 클릭 → 제목 수정, 빈 값이면 삭제 확인.
    async eventClick(info) {
      const event = info.event;
      const sourceName = event.extendedProps.sourceName;
      if (sourceName) {
        // 가져온 일정은 미러다. 원본에서 고쳐야 한다.
        showError(`'${sourceName}'에서 가져온 일정입니다. 원본 캘린더에서 수정하세요.`);
        return;
      }
      const next = prompt('제목 수정 (비우고 확인하면 삭제):', event.title);
      if (next === null) return;
      try {
        if (!next.trim()) {
          if (!confirm(`"${event.title}" 일정을 삭제할까요?`)) return;
          await api(`api/events/${event.id}`, { method: 'DELETE' });
        } else {
          await writeJSON(`api/events/${event.id}`, 'PATCH', { title: next.trim() });
        }
        calendar.refetchEvents();
      } catch (err) {
        showError(`수정 실패: ${err.message}`);
      }
    },

    eventDrop: (info) => persistTimes(info),
    eventResize: (info) => persistTimes(info),
  });

  // 드래그/리사이즈 결과를 서버에 반영. 실패하면 화면을 원상복구.
  async function persistTimes(info) {
    const event = info.event;
    try {
      await writeJSON(`api/events/${event.id}`, 'PATCH', {
        start: event.startStr,
        end: event.endStr || null,
        allDay: event.allDay,
      });
    } catch (err) {
      showError(`시간 변경 실패: ${err.message}`);
      info.revert();
    }
  }

  calendar.render();
</script>
</body>
</html>
